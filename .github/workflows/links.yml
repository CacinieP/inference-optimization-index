name: links

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check-links.py"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-links.py"
  schedule:
    # 每周一 09:00 (Asia/Shanghai) 巡检一次，防止外链随站点改版失效
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check external links
        run: python3 scripts/check-links.py --timeout 25 --jobs 10